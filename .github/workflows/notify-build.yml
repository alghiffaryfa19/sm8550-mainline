name: Notify Kernel Build

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BUILD_REPO_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'ianchb',
              repo: 'sheng-kernel-build',
              event_type: 'kernel-update',
              client_payload: { ref: context.ref }
            });


